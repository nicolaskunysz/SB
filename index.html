<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Production Prop Dashboard</title>
    <style>
        /* Centers everything on the page */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212; /* Dark background to look neat on set */
            color: #ffffff;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Removes bullet points entirely from the list */
        ul {
            list-style: none; 
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px; 
            width: 100%;
            max-width: 340px; 
        }

        li {
            width: 100%;
        }

        /* Turns plain links into clean standalone buttons */
        a {
            display: block;
            text-align: center;
            padding: 14px 20px;
            background-color: #22c55e; /* Vibrant action green */
            color: white;
            text-decoration: none; 
            font-weight: bold;
            border-radius: 8px; 
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        a:hover {
            background-color: #16a34a;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Bold Centered Production Menu Title -->
    <h1><b>Active Screen Props</b></h1>

    <!-- Navigation Menu Buttons -->
    <nav>
        <ul>
            <!-- Connected phone screen prop button -->
            <li><a href="whalewatch.html">Whale Watching Review (Smartphone Prop)</a></li>
            
            <!-- Connected new laptop screen prop button -->
            <li><a href="iucn.html">IPAA Species Registry (MacBook 13" Prop)</a></li>
        </ul>
    </nav>

</body>
</html>
