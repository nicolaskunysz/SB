<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whale Watching Review (Action Prop)</title>
    
    <!-- 📱 FULLSCREEN IMMERSIVE WEB APP CONFIGURATION (HIDES THE BROWSER URL BAR) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="phone-container">

        <header class="app-header">
            <a href="index.html" class="back-btn">✕</a>
            <div class="header-title">Write a Review</div>
            <div style="width: 1.2rem;"></div>
        </header>

        <main class="app-content">

            <div class="activity-banner">
                <img src="whale.jpg" alt="Whale" class="activity-photo">
                <h1 class="activity-name">The Classic Whale Watching Tour</h1>
            </div>

            <div class="activity-timestamp">
                <span class="timestamp-label">Date and Time of Activity</span>
                <span class="timestamp-value">Wednesday August 5 2026 at 09:35</span>
            </div>

            <div class="rating-card">
                
                <!-- ROW 1: OVERALL EXPERIENCE -->
                <div class="rating-row row-large" style="border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
                    <span class="metric-label">Overall Rating</span>
                    <div class="rating-group">
                        <div class="rating-circles">
                            <div class="circle c-1" data-value="1"></div>
                            <div class="circle c-2" data-value="2"></div>
                            <div class="circle c-3" data-value="3"></div>
                            <div class="circle c-4" data-value="4"></div>
                            <div class="circle c-5" data-value="5"></div>
                        </div>
                        <span class="rating-word-large"></span>
                    </div>
                </div>

                <!-- ROW 2: VALUE FOR MONEY -->
                <div class="rating-row row-small">
                    <span class="sub-label">Value for money</span>
                    <div class="rating-group">
                        <div class="rating-circles">
                            <div class="circle c-1" data-value="1"></div>
                            <div class="circle c-2" data-value="2"></div>
                            <div class="circle c-3" data-value="3"></div>
                            <div class="circle c-4" data-value="4"></div>
                            <div class="circle c-5" data-value="5"></div>
                        </div>
                        <span class="rating-word-small"></span>
                    </div>
                </div>

                <!-- ROW 3: GUIDE -->
                <div class="rating-row row-small">
                    <span class="sub-label">Guide</span>
                    <div class="rating-group">
                        <div class="rating-circles">
                            <div class="circle c-1" data-value="1"></div>
                            <div class="circle c-2" data-value="2"></div>
                            <div class="circle c-3" data-value="3"></div>
                            <div class="circle c-4" data-value="4"></div>
                            <div class="circle c-5" data-value="5"></div>
                        </div>
                        <span class="rating-word-small"></span>
                    </div>
                </div>

                <!-- ROW 4: MEETING OR PICKUP -->
                <div class="rating-row row-small">
                    <span class="sub-label">Meeting or pickup</span>
                    <div class="rating-group">
                        <div class="rating-circles">
                            <div class="circle c-1" data-value="1"></div>
                            <div class="circle c-2" data-value="2"></div>
                            <div class="circle c-3" data-value="3"></div>
                            <div class="circle c-4" data-value="4"></div>
                            <div class="circle c-5" data-value="5"></div>
                        </div>
                        <span class="rating-word-small"></span>
                    </div>
                </div>

            </div>

            <div class="review-card">
                <span class="editor-label">Review Title</span>
                <div id="titleInput" class="prop-input-title" contenteditable="true" spellcheck="false" placeholder="Title your review..."></div>

                <span class="editor-label">Review Details</span>
                <div id="bodyInput" class="prop-input-body" contenteditable="true" spellcheck="false" placeholder="Share your experience here..."></div>
            </div>

        </main>

        <footer class="action-footer">
            <!-- 🔄 Updated Cancel Button to call Reset Logic -->
            <button class="btn-cancel" onclick="resetFormProp()">Cancel</button>
            <button class="btn-publish" onclick="alert('Review Published!')">Publish</button>
        </footer>

    </div>

    <script>
        const adjectives = {
            1: { text: "Terrible", color: "text-red" },
            2: { text: "Mediocre", color: "text-orange" },
            3: { text: "Average", color: "text-yellow" },
            4: { text: "Good", color: "text-lightgreen" },
            5: { text: "Excellent", color: "text-green" }
        };

        // RATING INPUT INTERACTION ENGINE
        document.querySelectorAll('.rating-circles').forEach(group => {
            const circles = group.querySelectorAll('.circle');
            const label = group.nextElementSibling;

            circles.forEach(circle => {
                circle.addEventListener('click', () => {
                    const ratingValue = parseInt(circle.getAttribute('data-value'));

                    circles.forEach(c => {
                        const cVal = parseInt(c.getAttribute('data-value'));
                        if (cVal <= ratingValue) {
                            c.classList.add('filled');
                        } else {
                            c.classList.remove('filled');
                        }
                    });

                    const baseClass = group.closest('.rating-row').classList.contains('row-large') 
                        ? 'rating-word-large' 
                        : 'rating-word-small';
                    
                    label.className = `${baseClass} visible ${adjectives[ratingValue].color}`;
                    label.textContent = adjectives[ratingValue].text;
                });
            });
        });

        // 🔄 PROP CLEAN RESET FUNCTIONALITY
        function resetFormProp() {
            // 1. Wipe out text contents inside input divs
            document.getElementById('titleInput').textContent = "";
            document.getElementById('bodyInput').textContent = "";

            // 2. Clear out filled circle states across all metrics
            document.querySelectorAll('.circle').forEach(c => {
                c.classList.remove('filled');
            });

            // 3. Reset text and fully hide adjectives columns
            document.querySelectorAll('.rating-word-large, .rating-word-small').forEach(label => {
                label.textContent = "";
                label.classList.remove('visible', 'text-red', 'text-orange', 'text-yellow', 'text-lightgreen', 'text-green');
            });
        }
    </script>

</body>
</html>
